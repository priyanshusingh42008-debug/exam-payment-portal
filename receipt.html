<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Receipt</title><link rel="stylesheet" href="styles.css"></head><body><main>
<section class="card receipt"><div class="success">✓</div><h1>Payment receipt</h1><p class="muted">Payment verified by the authorized administrator.</p><div id="data"></div><button onclick="window.print()">Print / Save as PDF</button></section></main>
<script>(async()=>{const id=new URLSearchParams(location.search).get("id");const d=document.getElementById("data");if(!id){d.innerHTML="<p class='error'>Missing receipt ID.</p>";return}const r=await fetch("/api/payments/"+id);const p=await r.json();if(p.status!=="Verified"){d.innerHTML="<p class='error'>This receipt is not available until payment is verified.</p>";return}d.innerHTML=`<div class="receiptgrid"><span>Student</span><b>${p.name}</b><span>Enrollment / Roll</span><b>${p.roll}</b><span>Amount</span><b>₹${p.amount}</b><span>UTR / Reference</span><b>${p.utr}</b><span>Status</span><b>Verified</b><span>Receipt ID</span><b>${p.id}</b></div>`})()</script></body></html>
