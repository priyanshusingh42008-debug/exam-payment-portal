
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS EXAMs | Payment Receipt</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .receipt { max-width: 650px; margin: 40px auto; }
    .receiptgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 25px 0;
    }
    .receiptgrid span { color: #667085; }
    .success { color: #16803c; font-size: 38px; }
    @media print {
      button, header { display: none !important; }
      body { background: white; }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card receipt">
      <div class="success">✓</div>
      <h1>Payment receipt</h1>
      <p class="muted">CS EXAMs — Independent Practice Tests</p>
      <div id="data">Loading receipt...</div>
      <button id="print" onclick="window.print()" hidden>
        Print / Save as PDF
      </button>
      <p><a href="index.html">Return to homepage</a></p>
    </section>
  </main>

  <script>
  (async () => {
    const data = document.getElementById("data");
    const token = new URLSearchParams(location.search).get("token");

    if (!token) {
      data.textContent = "Receipt reference is missing.";
      return;
    }

    try {
      const response = await fetch(
        "/api/receipt/" + encodeURIComponent(token)
      );

      const payment = await response.json();

      if (!response.ok) {
        throw new Error(payment.error || "Receipt unavailable.");
      }

      const grid = document.createElement("div");
      grid.className = "receiptgrid";

      function addField(label, value) {
        const title = document.createElement("span");
        title.textContent = label;

        const detail = document.createElement("strong");
        detail.textContent = String(value ?? "Not available");

        grid.append(title, detail);
      }

      addField("Candidate", payment.name);
      addField("Registration ID", payment.roll);
      addField("Amount paid", "₹" + payment.amount);
      addField("Payment method", payment.paymentMethod);
      addField("Payment ID", payment.paymentId);
      addField("Status", payment.status);
      addField("Receipt ID", payment.id);
      addField("Payment date", new Date(payment.createdAt).toLocaleString("en-IN"));

      data.replaceChildren(grid);
      document.getElementById("print").hidden = false;

    } catch (error) {
      data.textContent = error.message;
    }
  })();
  </script>
</body>
</html>
