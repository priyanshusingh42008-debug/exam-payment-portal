<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Status</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><div class="logo">EP</div><div><b>Examination Payment Portal</b><small>Payment status</small></div></div><a href="index.html">Home</a></header>
<main><section class="card narrow"><h1>Payment status</h1><p class="muted">Enter your transaction reference to check its status.</p><input id="lookup" placeholder="Transaction reference / UTR"><button id="check">Check status</button><div id="result"></div></section></main><script>
document.getElementById("check").onclick=async()=>{const u=document.getElementById("lookup").value.trim(),r=document.getElementById("result");if(!u){r.innerHTML="<p class='error'>Enter a reference.</p>";return}const all=await fetch("/api/payments").then(x=>x.json());const p=all.find(x=>x.utr.toLowerCase()===u.toLowerCase());if(!p){r.innerHTML="<p class='error'>No submission found.</p>";return}r.innerHTML=`<div class="statusbox"><b>${p.status}</b><p>${p.name} · ${p.roll}</p><p>Amount: ₹${p.amount}</p>${p.status==="Verified"?`<a class="buttonlink" href="receipt.html?id=${p.id}">Open receipt</a>`:""}</div>`}
</script></body></html>
