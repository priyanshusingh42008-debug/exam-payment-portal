<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS EXAMs — Registration Status</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><div class="logo">CS</div><div><b>CS EXAMs</b><small>Registration status</small></div></div><a href="index.html">Home</a></header>
<main><section class="card narrow"><h1>Check registration status</h1><p class="muted">Enter the registration ID shown after checkout, or an old UTR/reference number.</p><label for="lookup">Registration ID / UTR</label><input id="lookup" placeholder="Enter your reference"><button id="check">Check status</button><div id="result" role="status" aria-live="polite"></div></section></main>
<script>
document.getElementById("check").onclick=async()=>{
 const reference=document.getElementById("lookup").value.trim(),result=document.getElementById("result");
 if(!reference){result.innerHTML="<p class='error'>Enter your registration ID or UTR.</p>";return}
 try{
  const response=await fetch("/api/payments/lookup?reference="+encodeURIComponent(reference));
  const p=await response.json();if(!response.ok)throw new Error(p.error||"No record found.");
  const box=document.createElement("div");box.className="statusbox";
  const heading=document.createElement("b");heading.textContent=p.status;box.appendChild(heading);
  const details=document.createElement("p");details.textContent=p.name+" · "+p.roll+" · Amount: ₹"+p.amount;box.appendChild(details);
  if(p.status==="Verified"&&p.paymentMethod==="Razorpay"){const link=document.createElement("a");link.className="buttonlink";link.href="receipt.html?id="+encodeURIComponent(p.id);link.textContent="Open receipt";box.appendChild(link)}
  result.replaceChildren(box);
 }catch(e){result.innerHTML="";const p=document.createElement("p");p.className="error";p.textContent=e.message;result.appendChild(p)}
};
</script></body></html>
