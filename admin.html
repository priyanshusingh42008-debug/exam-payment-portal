<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Administration</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><div class="logo">EP</div><div><b>Payment Administration</b><small>Authorized administrator area</small></div></div><a href="index.html">Portal</a></header><main><section class="card"><div class="row"><div><h1>Payment submissions</h1><p class="muted">Verify transactions against the authorized payment account before approving.</p></div><button class="refresh" onclick="load()">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Roll</th><th>UTR</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
async function load(){const a=await fetch("/api/payments").then(x=>x.json());document.getElementById("rows").innerHTML=a.length?a.map(p=>`<tr><td>${p.name}</td><td>${p.roll}</td><td>${p.utr}</td><td>₹${p.amount}</td><td><span class="pill ${p.status.toLowerCase()}">${p.status}</span></td><td><button onclick="setStatus('${p.id}','Verified')">Verify</button> <button class="reject" onclick="setStatus('${p.id}','Rejected')">Reject</button></td></tr>`).join(""):`<tr><td colspan="6">No submissions yet.</td></tr>`}
async function setStatus(id,status){await fetch("/api/payments/"+id+"/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}load();
</script></body></html>
